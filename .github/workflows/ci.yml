name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SagemakerCICDCTLambda/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check (warning only)
        run: |
          if ! terraform fmt -check -recursive -diff; then
            echo "::warning::Some .tf files are not in canonical format. Run 'terraform fmt -recursive' to fix."
          fi

      - name: Init (no backend, no AWS credentials needed)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # same as the Lambda runtime

      - name: Install test dependencies
        run: pip install pytest boto3

      - name: Compile Lambda code
        run: python -m py_compile SagemakerCICDCTLambda/lambda/*.py SagemakerCICDCTLambda/chatlambda/*.py SagemakerCICDCTLambda/monitoring/*.py

      - name: Run tests
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: pytest SagemakerCICDCTLambda/tests -v

  training:
    name: Training + evaluation test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10" # same as the PyTorch 2.2.0 training container

      - name: Install CPU PyTorch and the training requirements
        run: |
          pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" pytest boto3 -r SagemakerCICDCTLambda/training/requirements.txt

      - name: Train a tiny model, evaluate it against a champion, check the gate's metrics
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: pytest SagemakerCICDCTLambda/tests/test_training_gate.py -v
